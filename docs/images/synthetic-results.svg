ail</text><text x="238" y="346" font-size="10" text-anchor="end" fill="#5f6368">28 items</text><rect x="250" y="316" width="464.2857142857143" height="14" rx="3" fill="#1a73e8"/><text x="720.2857142857142" y="327" font-size="11" font-weight="700" fill="#1a73e8">92.9%</text><rect x="250" y="334" width="464.2857142857143" height="14" rx="3" fill="#e37400"/><text x="720.2857142857142" y="345" font-size="11" font-weight="700" fill="#e37400">92.9%</text><rect x="30" y="387" width="14" height="14" rx="3" fill="#1a73e8"/><text x="50" y="398" font-size="12" fill="#202124">Precision</text><rect x="140" y="387" width="14" height="14" rx="3" fill="#e37400"/><text x="160" y="398" font-size="12" fill="#202124">Recall</text><text x="830" y="398" font-size="12" text-anchor="end" fill="#188038" font-weight="700">date accuracy 100% (42 dated items)</text></svg>