name: Sweep

# Calls the app's scan endpoint every 5 minutes (GitHub's minimum). The endpoint drains the message queue,
# retries recent unprocessed mail (safety net for missed Gmail pushes), and keeps the Gmail watch alive.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call /api/cron/scan
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ vars.SITE_URL || 'https://promise-keeper-omega.vercel.app' }}
        run: |
          test -n "$CRON_SECRET" || { echo "CRON_SECRET repository secret is not set"; exit 1; }
          curl --fail-with-body -sS -m 90 -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/scan"
