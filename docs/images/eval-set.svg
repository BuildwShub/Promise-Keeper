<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" width="860" height="420" font-family="Segoe UI, Helvetica, Arial, sans-serif"><rect width="860" height="420" rx="12" fill="#ffffff" stroke="#e0e3e7"/><text x="70" y="32" font-size="18" font-weight="700" fill="#202124">What the evaluation set contains</text><text x="70" y="52" font-size="12" fill="#5f6368">106 real emails, hand-labelled. Most contain nothing to extract, which is what makes false alarms measurable.</text><rect x="70" y="72" width="695.4716981132076" height="34" fill="#dadce0"/><rect x="765.4716981132076" y="72" width="64.5283018867924" height="34" fill="#1a73e8"/><text x="80" y="94" font-size="13" font-weight="700" fill="#202124">97 emails with nothing to extract (marketing, automated notices, everyday mail, traps)</text><text x="771.4716981132076" y="127" font-size="13" font-weight="700" fill="#1a73e8">9 with a real commitment</text><text x="70" y="147" font-size="13" font-weight="700" fill="#202124">Tags (an email can have several)</text><text x="70" y="170" font-size="12" fill="#202124">marketing</text><rect x="190" y="157" width="610" height="16" rx="3" fill="#1a73e8" opacity="0.85"/><text x="806" y="170" font-size="12" fill="#5f6368">49</text><text x="70" y="195" font-size="12" fill="#202124">automated</text><rect x="190" y="182" width="585.1020408163265" height="16" rx="3" fill="#1a73e8" opacity="0.85"/><text x="781.1020408163265" y="195" font-size="12" fill="#5f6368">47</text><text x="70" y="220" font-size="12" fill="#202124">human</text><rect x="190" y="207" width="124.48979591836735" height="16" rx="3" fill="#1a73e8" opacity="0.85"/><text x="320.48979591836735" y="220" font-size="12" fill="#5f6368">10</text><text x="70" y="245" font-size="12" fill="#202124">has request</text><rect x="190" y="232" width="62.244897959183675" height="16" rx="3" fill="#1a73e8" opacity="0.85"/><text x="258.2448979591837" y="245" font-size="12" fill="#5f6368">5</text><text x="70" y="270" font-size="12" fill="#202124">trap</text><rect x="190" y="257" width="62.244897959183675" height="16" rx="3" fill="#e37400" opacity="0.85"/><text x="258.2448979591837" y="270" font-size="12" fill="#5f6368">5</text><text x="70" y="295" font-size="12" fill="#202124">date vague</text><rect x="190" y="282" width="62.244897959183675" height="16" rx="3" fill="#1a73e8" opacity="0.85"/><text x="258.2448979591837" y="295" font-size="12" fill="#5f6368">5</text><text x="70" y="320" font-size="12" fill="#202124">date relative</text><rect x="190" y="307" width="37.3469387755102" height="16" rx="3" fill="#1a73e8" opacity="0.85"/><text x="233.3469387755102" y="320" font-size="12" fill="#5f6368">3</text><text x="70" y="345" font-size="12" fill="#202124">hinglish</text><rect x="190" y="332" width="37.3469387755102" height="16" rx="3" fill="#1a73e8" opacity="0.85"/><text x="233.3469387755102" y="345" font-size="12" fill="#5f6368">3</text><text x="70" y="370" font-size="12" fill="#202124">has promise</text><rect x="190" y="357" width="24.897959183673468" height="16" rx="3" fill="#1a73e8" opacity="0.85"/><text x="220.89795918367346" y="370" font-size="12" fill="#5f6368">2</text></svg>